name: apex-build-image

on:
  push:
    branches:
      - actions-blocked-run-fix
      - actions-blocked-run-fix-v1.27.2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rootless
          platforms: linux/amd64
          push: true
          # Do NOT cache the golang base layer: Dockerfile.rootless builds FROM the floating tag
          # golang:1.26-alpine3.24, and pulling it fresh each build is what picks up Go patch
          # releases (1.26.5 -> 1.26.7 cleared 8 HIGH stdlib CVEs with no code change).
          pull: true
          no-cache: false
          # NB: the gitea helm chart appends "-rootless" to image.tag when rootless=true, so the
          # immutable pin tag is 1.27.2-apex-<sha>-rootless (the chart pulls it from image.tag:
          # 1.27.2-apex-<sha>). The moving 1.27.2-apex-rootless tag is kept for convenience only.
          tags: |
            ghcr.io/aagarwal-apexanalytix/gitea:1.27.2-apex-rootless
            ghcr.io/aagarwal-apexanalytix/gitea:1.27.2-apex-${{ github.sha }}-rootless
          build-args: |
            GITEA_VERSION=1.27.2
